# Render Blueprint — https://render.com/docs/blueprint-spec
# First deploy: Dashboard → New → Blueprint → connect GitHub repo (main).
# Auto-deploy: each push to `main` rebuilds and redeploys (see autoDeployTrigger).
# Secrets: set DEEPSEEK_API_KEY in Render Environment only — never commit secrets.toml.
services:
  - type: web
    name: edu-question-generator
    runtime: python
    plan: free
    region: frankfurt
    branch: main
    autoDeployTrigger: commit
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: >-
      streamlit run app.py
      --server.port=$PORT
      --server.address=0.0.0.0
      --server.headless=true
      --server.enableCORS=false
      --server.enableXsrfProtection=false
      --server.enableWebsocketCompression=false
      --browser.gatherUsageStats=false
    healthCheckPath: /_stcore/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: LLM_PROVIDER
        value: deepseek
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: AUTO_FALLBACK_TO_GROQ
        value: "false"
      - key: SHOW_ALTERNATE_LLM_PROVIDERS
        value: "false"
      - key: TARGET_QUESTIONS_TOTAL
        value: "20"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
